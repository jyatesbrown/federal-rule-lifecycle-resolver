[project]
name = "federal-rule-lifecycle-resolver"
version = "1.0.0"
description = "Apify Actor resolving a federal rulemaking across the Federal Register and Regulations.gov into one lifecycle record."
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real federal APIs (run explicitly with -m live)"]
addopts = "-m 'not live'"
